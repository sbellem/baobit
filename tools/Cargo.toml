[package]
name = "verify-binary"
version = "0.1.0"
edition = "2021"
description = "Parse and verify signed Baochip firmware images"

[profile.release]
strip = true
lto = true

[[bin]]
name = "verify-binary"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
digest = "0.10"
ed25519-dalek = { version = "2", features = ["digest"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
