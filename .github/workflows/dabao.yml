name: Build dabao

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dabao:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - root: dabao
            target: dabao
          - root: bao1x-baremetal-dabao
            target: baremetal-dabao
    steps:
      - uses: actions/checkout@v4

      - name: Install Guix
        uses: sbellem/guix-install-action@dev
        with:
          version: "1.5.0"
          pullAfterInstall: false

      - name: Authorize substitute servers
        run: |
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --authorize < keys/guix.baobit.one.pub
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --authorize < keys/ci.guix.moe.pub

      - name: Build ${{ matrix.root }}
        run: make ROOT=${{ matrix.root }} ${{ matrix.target }}

      - name: Check reproducibility
        run: make CHECK=1 ${{ matrix.target }}

      - name: Report results
        if: always()
        run: |
          echo "## ${{ matrix.root }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Store Path" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          STORE_PATH=$(readlink -f ${{ matrix.root }} 2>/dev/null || echo 'Build failed')
          echo "$STORE_PATH" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Checksums" >> $GITHUB_STEP_SUMMARY
          shopt -s nullglob
          echo '**SHA256:**' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in ${{ matrix.root }}/*.uf2 ${{ matrix.root }}/*.img ${{ matrix.root }}/*.bin; do
            [ -f "$f" ] && sha256sum "$f" >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '**MD5:**' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in ${{ matrix.root }}/*.uf2 ${{ matrix.root }}/*.img ${{ matrix.root }}/*.bin; do
            [ -f "$f" ] && md5sum "$f" >> $GITHUB_STEP_SUMMARY
          done
          shopt -u nullglob
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Copy artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp ${{ matrix.root }}/*.uf2 artifacts/ 2>/dev/null || true
          cp ${{ matrix.root }}/*.img artifacts/ 2>/dev/null || true
          cp ${{ matrix.root }}/*.bin artifacts/ 2>/dev/null || true

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.root }}
          path: artifacts/
          if-no-files-found: warn
