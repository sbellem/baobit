name: Build dabao

on:
  push:
    branches: [main, ci*]
  workflow_dispatch:

jobs:
  dabao:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channels: ['channels.scm', 'channels-codeberg.scm']
    steps:
      - uses: actions/checkout@v4

      - name: Install Guix
        uses: sbellem/guix-install-action@dev
        with:
          version: "1.5.0"
          pullAfterInstall: false

      - name: Authorize substitute servers
        run: |
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --authorize < keys/guix.baobit.one.pub
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --authorize < keys/ci.guix.moe.pub

      - name: Build dabao
        run: make CHANNELS=${{ matrix.channels }} ROOT=dabao dabao

      - name: Check reproducibility
        run: make CHANNELS=${{ matrix.channels }} CHECK=1 dabao

      - name: Report results
        if: always()
        run: |
          echo "## dabao (${{ matrix.channels }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Store Path" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          STORE_PATH=$(readlink -f dabao 2>/dev/null || echo 'Build failed')
          echo "$STORE_PATH" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Checksums" >> $GITHUB_STEP_SUMMARY
          shopt -s nullglob
          echo '**SHA256:**' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in dabao/*.uf2 dabao/*.img dabao/*.bin; do
            [ -f "$f" ] && sha256sum "$f" >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '**MD5:**' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in dabao/*.uf2 dabao/*.img dabao/*.bin; do
            [ -f "$f" ] && md5sum "$f" >> $GITHUB_STEP_SUMMARY
          done
          shopt -u nullglob
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Copy artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp dabao/*.uf2 artifacts/ 2>/dev/null || true
          cp dabao/*.img artifacts/ 2>/dev/null || true
          cp dabao/*.bin artifacts/ 2>/dev/null || true

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dabao-${{ matrix.channels }}
          path: artifacts/
          if-no-files-found: warn
