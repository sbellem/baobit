name: Build bootloader

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bootloader:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [boot0, boot1, alt-boot1]
    steps:
      - uses: actions/checkout@v4

      - name: Install Guix
        uses: sbellem/guix-install-action@dev
        with:
          version: "1.5.0"
          pullAfterInstall: false

      - name: Authorize substitute servers
        run: |
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --authorize < keys/guix.baobit.one.pub
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --authorize < keys/ci.guix.moe.pub

      - name: Build bao1x-${{ matrix.target }}
        run: make ROOT=bao1x-${{ matrix.target }} ${{ matrix.target }}

      - name: Check reproducibility
        run: make CHECK=1 ${{ matrix.target }}

      - name: Generate ELF analysis
        run: make ROOT=${{ matrix.target }}-elf-analysis ${{ matrix.target }}-elf-analysis

      - name: Verify ELF analysis matches build
        run: |
          FIRMWARE_PATH=$(readlink -f bao1x-${{ matrix.target }})
          REPORT_FIRMWARE=$(grep "^; Firmware:" ${{ matrix.target }}-elf-analysis/*-elf-analysis.rpt | head -1 | awk '{print $3}')
          if [ "$FIRMWARE_PATH" != "$REPORT_FIRMWARE" ]; then
            echo "ERROR: ELF analysis is for different build!"
            echo "  Built firmware: $FIRMWARE_PATH"
            echo "  Report firmware: $REPORT_FIRMWARE"
            exit 1
          fi
          echo "ELF analysis verified for: $FIRMWARE_PATH"

      - name: Display ELF summary
        run: |
          echo "### ELF Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat ${{ matrix.target }}-elf-analysis/*-elf-analysis-summary.rpt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Report results
        if: always()
        run: |
          echo "## bao1x-${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Store Path" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          STORE_PATH=$(readlink -f bao1x-${{ matrix.target }} 2>/dev/null || echo 'Build failed')
          echo "$STORE_PATH" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Checksums" >> $GITHUB_STEP_SUMMARY
          shopt -s nullglob
          echo '**SHA256:**' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in bao1x-${{ matrix.target }}/*.uf2 bao1x-${{ matrix.target }}/*.img bao1x-${{ matrix.target }}/*.bin bao1x-${{ matrix.target }}/*.elf; do
            [ -f "$f" ] && sha256sum "$f" >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '**SHA512:**' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in bao1x-${{ matrix.target }}/*.uf2 bao1x-${{ matrix.target }}/*.img bao1x-${{ matrix.target }}/*.bin bao1x-${{ matrix.target }}/*.elf; do
            [ -f "$f" ] && sha512sum "$f" >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '**MD5:**' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in bao1x-${{ matrix.target }}/*.uf2 bao1x-${{ matrix.target }}/*.img bao1x-${{ matrix.target }}/*.bin bao1x-${{ matrix.target }}/*.elf; do
            [ -f "$f" ] && md5sum "$f" >> $GITHUB_STEP_SUMMARY
          done
          shopt -u nullglob
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Copy artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp bao1x-${{ matrix.target }}/*.uf2 artifacts/ 2>/dev/null || true
          cp bao1x-${{ matrix.target }}/*.img artifacts/ 2>/dev/null || true
          cp bao1x-${{ matrix.target }}/*.bin artifacts/ 2>/dev/null || true
          cp bao1x-${{ matrix.target }}/*.elf artifacts/ 2>/dev/null || true
          cp ${{ matrix.target }}-elf-analysis/*.rpt artifacts/ 2>/dev/null || true

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bao1x-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: warn
