name: Build bootloader

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bao1x-boot0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Guix
        uses: sbellem/guix-install-action@dev
        with:
          version: "1.5.0"
          pullAfterInstall: false

      - name: Authorize substitute servers
        run: |
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --authorize < keys/guix.baobit.one.pub
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --authorize < keys/ci.guix.moe.pub

      - name: Build bao1x-boot0
        run: make ROOT=bao1x-boot0 boot0

      - name: Check reproducibility
        run: make CHECK=1 boot0

      - name: Generate ELF analysis
        run: make ROOT=boot0-elf-analysis boot0-elf-analysis

      - name: Verify ELF analysis matches build
        run: |
          FIRMWARE_PATH=$(readlink -f bao1x-boot0)
          REPORT_FIRMWARE=$(grep "^; Firmware:" boot0-elf-analysis/*-elf-analysis.rpt | head -1 | awk '{print $3}')
          if [ "$FIRMWARE_PATH" != "$REPORT_FIRMWARE" ]; then
            echo "ERROR: ELF analysis is for different build!"
            echo "  Built firmware: $FIRMWARE_PATH"
            echo "  Report firmware: $REPORT_FIRMWARE"
            exit 1
          fi
          echo "ELF analysis verified for: $FIRMWARE_PATH"

      - name: Display ELF summary
        run: |
          echo "### ELF Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat boot0-elf-analysis/*-elf-analysis-summary.rpt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Report results
        if: always()
        run: |
          echo "## bao1x-boot0" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Store Path" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          STORE_PATH=$(readlink -f bao1x-boot0 2>/dev/null || echo 'Build failed')
          echo "$STORE_PATH" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Checksums" >> $GITHUB_STEP_SUMMARY
          shopt -s nullglob
          echo '**SHA256:**' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in bao1x-boot0/*.uf2 bao1x-boot0/*.img bao1x-boot0/*.bin bao1x-boot0/*.elf; do
            [ -f "$f" ] && sha256sum "$f" >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '**MD5:**' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in bao1x-boot0/*.uf2 bao1x-boot0/*.img bao1x-boot0/*.bin bao1x-boot0/*.elf; do
            [ -f "$f" ] && md5sum "$f" >> $GITHUB_STEP_SUMMARY
          done
          shopt -u nullglob
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Copy artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp bao1x-boot0/*.uf2 artifacts/ 2>/dev/null || true
          cp bao1x-boot0/*.img artifacts/ 2>/dev/null || true
          cp bao1x-boot0/*.bin artifacts/ 2>/dev/null || true
          cp bao1x-boot0/*.elf artifacts/ 2>/dev/null || true
          cp boot0-elf-analysis/*.rpt artifacts/ 2>/dev/null || true

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bao1x-boot0
          path: artifacts/
          if-no-files-found: warn

