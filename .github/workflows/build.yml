name: Build packages

on:
  workflow_dispatch:

jobs:
  # Toolchain: bare metal sysroot
  rust-sysroot-riscv32imac-none-elf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channels: ['channels/guix.scm', 'channels/guix-savannah.scm']
    steps:
      - uses: actions/checkout@v4

      - name: Install Guix
        uses: sbellem/guix-install-action@dev
        with:
          version: "1.5.0"
          pullAfterInstall: false

      - name: Authorize substitute servers
        run: |
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --authorize < keys/guix.baobit.one.pub
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --authorize < keys/ci.guix.moe.pub

      - name: Build rust-sysroot-riscv32imac-none-elf
        run: make CHANNELS=${{ matrix.channels }} ROOT=sysroot-none-elf rv32imac-none

      - name: Check reproducibility
        run: make CHANNELS=${{ matrix.channels }} CHECK=1 rv32imac-none

      - name: Report results
        if: always()
        run: |
          echo "## rust-sysroot-riscv32imac-none-elf (${{ matrix.channels }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Store Path" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          STORE_PATH=$(readlink -f sysroot-none-elf 2>/dev/null || echo 'Build failed')
          echo "$STORE_PATH" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Export nar archive
        if: success()
        run: |
          mkdir -p nars
          if [ -L sysroot-none-elf ]; then
            store_path=$(readlink -f sysroot-none-elf)
            if [ -d "$store_path" ]; then
              guix archive --export "$store_path" | gzip > nars/sysroot-none-elf.nar.gz
            fi
          fi

      - name: Upload nar archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-none-elf-${{ matrix.channels }}
          path: nars/
          if-no-files-found: warn

  # Toolchain: xous sysroot
  xous-sysroot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channels: ['channels/guix.scm', 'channels/guix-savannah.scm']
    steps:
      - uses: actions/checkout@v4

      - name: Install Guix
        uses: sbellem/guix-install-action@dev
        with:
          version: "1.5.0"
          pullAfterInstall: false

      - name: Authorize substitute servers
        run: |
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --authorize < keys/guix.baobit.one.pub
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --authorize < keys/ci.guix.moe.pub

      - name: Build rust-sysroot-riscv32imac-xous-elf
        run: make CHANNELS=${{ matrix.channels }} ROOT=sysroot-xous-elf rv32imac-xous

      - name: Check reproducibility
        run: make CHANNELS=${{ matrix.channels }} CHECK=1 rv32imac-xous

      - name: Report results
        if: always()
        run: |
          echo "## rust-sysroot-riscv32imac-xous-elf (${{ matrix.channels }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Store Path" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          STORE_PATH=$(readlink -f sysroot-xous-elf 2>/dev/null || echo 'Build failed')
          echo "$STORE_PATH" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Export nar archive
        if: success()
        run: |
          mkdir -p nars
          if [ -L sysroot-xous-elf ]; then
            store_path=$(readlink -f sysroot-xous-elf)
            if [ -d "$store_path" ]; then
              guix archive --export "$store_path" | gzip > nars/sysroot-xous-elf.nar.gz
            fi
          fi

      - name: Upload nar archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-xous-elf-${{ matrix.channels }}
          path: nars/
          if-no-files-found: warn

  # Gate: check if at least one sysroot channel succeeded
  sysroot-ready:
    needs: [rust-sysroot-riscv32imac-none-elf, xous-sysroot]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Download sysroot artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sysroot-*
          merge-multiple: true
          path: artifacts
        continue-on-error: true

      - name: Check if any channel succeeded
        id: check
        run: |
          if ls artifacts/*.nar.gz 2>/dev/null; then
            echo "ready=true" >> $GITHUB_OUTPUT
            echo "✓ At least one sysroot channel succeeded"
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "✗ Both sysroot channels failed"
            exit 1
          fi

