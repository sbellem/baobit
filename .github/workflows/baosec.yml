name: Build baosec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  baosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Guix
        uses: ./.github/actions/setup-guix

      - name: Build baosec
        timeout-minutes: 120
        uses: ./.github/actions/retry
        with:
          run: make ROOT=baosec baosec

      - name: Check reproducibility
        timeout-minutes: 120
        uses: ./.github/actions/retry
        with:
          run: make CHECK=1 baosec

      - name: Report results
        if: always()
        run: |
          echo "## baosec" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Store Path" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          STORE_PATH=$(readlink -f baosec 2>/dev/null || echo 'Build failed')
          echo "$STORE_PATH" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Checksums" >> $GITHUB_STEP_SUMMARY
          shopt -s nullglob
          echo '**SHA256:**' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in baosec/*.uf2 baosec/*.img baosec/*.bin; do
            [ -f "$f" ] && sha256sum "$f" >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '**SHA512:**' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in baosec/*.uf2 baosec/*.img baosec/*.bin; do
            [ -f "$f" ] && sha512sum "$f" >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '**MD5:**' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in baosec/*.uf2 baosec/*.img baosec/*.bin; do
            [ -f "$f" ] && md5sum "$f" >> $GITHUB_STEP_SUMMARY
          done
          shopt -u nullglob
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Copy artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp baosec/*.uf2 artifacts/ 2>/dev/null || true
          cp baosec/*.img artifacts/ 2>/dev/null || true
          cp baosec/*.bin artifacts/ 2>/dev/null || true

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: baosec
          path: artifacts/
          if-no-files-found: warn
