name: Build baosec

on:
  push:
    branches: [main, ci*]
  workflow_dispatch:

jobs:
  baosec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channels: ['channels.scm', 'channels-codeberg.scm']
    steps:
      - uses: actions/checkout@v4

      - name: Set baobit commit
        run: |
          COMMIT=$(git rev-parse HEAD)
          cat > packages/baobit-config.scm << EOF
          (define-module (baobit-config)
            #:export (%baobit-commit))
          (define %baobit-commit "$COMMIT")
          EOF
          echo "Set baobit commit to: $COMMIT"

      - name: Install Guix
        uses: sbellem/guix-install-action@dev
        with:
          version: "1.5.0"
          pullAfterInstall: false

      - name: Authorize substitute servers
        run: |
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --authorize < keys/guix.baobit.one.pub
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --authorize < keys/ci.guix.moe.pub

      - name: Build baosec
        run: make CHANNELS=${{ matrix.channels }} ROOT=baosec baosec

      - name: Check reproducibility
        run: make CHANNELS=${{ matrix.channels }} CHECK=1 baosec

      - name: Report results
        if: always()
        run: |
          echo "## baosec (${{ matrix.channels }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Store Path" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          STORE_PATH=$(readlink -f baosec 2>/dev/null || echo 'Build failed')
          echo "$STORE_PATH" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Checksums" >> $GITHUB_STEP_SUMMARY
          shopt -s nullglob
          echo '**SHA256:**' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in baosec/*.uf2 baosec/*.img baosec/*.bin; do
            [ -f "$f" ] && sha256sum "$f" >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '**MD5:**' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in baosec/*.uf2 baosec/*.img baosec/*.bin; do
            [ -f "$f" ] && md5sum "$f" >> $GITHUB_STEP_SUMMARY
          done
          shopt -u nullglob
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Copy artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp baosec/*.uf2 artifacts/ 2>/dev/null || true
          cp baosec/*.img artifacts/ 2>/dev/null || true
          cp baosec/*.bin artifacts/ 2>/dev/null || true

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: baosec-${{ matrix.channels }}
          path: artifacts/
          if-no-files-found: warn
